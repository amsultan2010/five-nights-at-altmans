<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Five Nights at Altman's</title>
<meta name=description content="A browser parody of Five Nights at Freddy's starring tech CEOs.">
</head><body>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#ddd}
html,body{position:fixed;inset:0;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);transform-origin:50% 50%;background:#000;image-rendering:auto;outline:none;touch-action:none}
</style>
<canvas id="c" width="1280" height="720" tabindex="0" aria-label="Five Nights at Altman's game screen"></canvas>
<script>
"use strict";
// ============================================================ core
const W=1280,H=720,cv=document.getElementById('c'),ctx=cv.getContext('2d');
const IMG={},URLS={},BUF={};let AC=null,master=null;
const R=n=>Math.floor(Math.random()*n);            // Clickteam Random(n): 0..n-1
// phones/tablets: the game always plays landscape. Held upright, the whole screen is turned sideways.
const TOUCH=matchMedia('(pointer: coarse)').matches||('ontouchstart' in window);
let rotated=false,dispW=W,dispH=H;
function fit(){
  const vw=innerWidth,vh=innerHeight;
  rotated=TOUCH&&vh>vw;
  const aw=rotated?vh:vw,ah=rotated?vw:vh,s=Math.min(aw/W,ah/H);
  dispW=W*s;dispH=H*s;cv.style.width=dispW+'px';cv.style.height=dispH+'px';
  cv.style.transform='translate(-50%,-50%)'+(rotated?' rotate(90deg)':'');
}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,150));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
fit();

// ---- input (mouse: click/hover as before; touch: tap = click, drag = look around)
let mx=640,my=360,clicks=[],keys={},keyQ=[],pointerType='mouse',dragDX=0;
function toLogical(e){
  const r=cv.getBoundingClientRect();let X=e.clientX-(r.left+r.width/2),Y=e.clientY-(r.top+r.height/2);
  if(rotated){const t=X;X=Y;Y=-t}          // undo the 90deg turn
  return[X*W/dispW+W/2,Y*H/dispH+H/2]}
// ---- volume slider (top centre, on every screen). Click the speaker to mute; - / = keys also work.
let VOL=1;try{const v=parseFloat(localStorage.getItem('fnaa_vol'));if(v>=0&&v<=1)VOL=v}catch(_){}
let volPrev=VOL>0?VOL:1,volDrag=null,volHover=false;
const VB={x:548,y:8,w:184,h:42,tx:606,tw:114,ty:29};
function volHit(p,pad=0){return p[0]>=VB.x-pad&&p[0]<=VB.x+VB.w+pad&&p[1]>=0&&p[1]<=VB.y+VB.h+pad}
function volGain(){return VOL*VOL}            // squared so the slider feels even to the ear
function applyVol(){if(master)master.gain.value=volGain();try{localStorage.setItem('fnaa_vol',String(VOL))}catch(_){}}
function setVolX(x){VOL=Math.max(0,Math.min(1,(x-VB.tx)/VB.tw));if(VOL>0)volPrev=VOL;applyVol()}
function volToggle(){if(VOL>0){volPrev=VOL;VOL=0}else VOL=volPrev||1;applyVol()}
function volDown(e,p){if(!volHit(p,e.pointerType==='mouse'?0:14))return false;
  if(p[0]<VB.tx-8){volToggle();return true}
  volDrag=e.pointerId;setVolX(p[0]);return true}
addEventListener('keydown',e=>{if(e.key==='-'||e.key==='_'){VOL=Math.max(0,Math.round(VOL*10-1)/10);applyVol()}
  else if(e.key==='='||e.key==='+'){VOL=Math.min(1,Math.round(VOL*10+1)/10);if(VOL>0)volPrev=VOL;applyVol()}});
function drawVol(){
  ctx.save();ctx.globalAlpha=volDrag!=null||volHover?1:.55;
  ctx.fillStyle='rgba(0,0,0,.5)';ctx.fillRect(VB.x,VB.y,VB.w,VB.h);
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.strokeRect(VB.x+1,VB.y+1,VB.w-2,VB.h-2);
  const cy=VB.ty;ctx.fillStyle='#fff';ctx.beginPath();
  ctx.moveTo(558,cy-6);ctx.lineTo(565,cy-6);ctx.lineTo(574,cy-14);ctx.lineTo(574,cy+14);ctx.lineTo(565,cy+6);ctx.lineTo(558,cy+6);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();
  if(VOL===0){ctx.moveTo(580,cy-6);ctx.lineTo(592,cy+6);ctx.moveTo(592,cy-6);ctx.lineTo(580,cy+6)}
  else{ctx.arc(574,cy,8,-.8,.8);if(VOL>.5){ctx.moveTo(574+14*Math.cos(-.8),cy+14*Math.sin(-.8));ctx.arc(574,cy,14,-.8,.8)}}
  ctx.stroke();
  ctx.fillStyle='#555';ctx.fillRect(VB.tx,cy-2,VB.tw,4);ctx.fillStyle='#fff';ctx.fillRect(VB.tx,cy-2,VB.tw*VOL,4);
  ctx.fillRect(Math.round(VB.tx+VB.tw*VOL-5),cy-11,10,22);
  ctx.restore();
}
// ---- credit link on the title screen
const CREDIT={url:'https://www.amsultan.site',hover:false};
function creditHit(p,pad=0){if(scene!==S_TITLE||!IMG[433])return false;const w=IMG[433].width;
  return p[0]>=1266-w-pad&&p[0]<=1266+pad&&p[1]>=684-pad&&p[1]<=712+pad}
function openCredit(){const w=window.open(CREDIT.url,'_blank','noopener');
  if(!w){const a=document.createElement('a');a.href=CREDIT.url;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}}
addEventListener('click',e=>{if(creditHit(toLogical(e),e.pointerType==='mouse'?0:12))openCredit()});
const tp={id:null,x0:0,y0:0,lx:0,moved:false};
addEventListener('pointermove',e=>{const p=toLogical(e);pointerType=e.pointerType;
  if(volDrag===e.pointerId){setVolX(p[0]);e.preventDefault();return}
  if(e.pointerType==='mouse'){volHover=volHit(p);CREDIT.hover=creditHit(p);cv.style.cursor=CREDIT.hover?'pointer':'';[mx,my]=p;return}
  if(e.pointerId!==tp.id)return;
  [mx,my]=p;dragDX+=p[0]-tp.lx;tp.lx=p[0];
  if(Math.hypot(p[0]-tp.x0,p[1]-tp.y0)>24)tp.moved=true;e.preventDefault()},{passive:false});
addEventListener('pointerdown',e=>{const p=toLogical(e);pointerType=e.pointerType;cv.focus();e.preventDefault();
  if(volDown(e,p))return;          // slider/speaker touched: the game never sees it
  if(e.pointerType==='mouse'){[mx,my]=p;clicks.push(p);return}
  if(!e.isPrimary)return;
  tp.id=e.pointerId;tp.x0=p[0];tp.y0=p[1];tp.lx=p[0];tp.moved=false;[mx,my]=p},{passive:false});
addEventListener('pointerup',e=>{if(volDrag===e.pointerId){volDrag=null;return}
  if(e.pointerType==='mouse'||e.pointerId!==tp.id)return;
  const p=toLogical(e);[mx,my]=p;tp.id=null;if(!tp.moved)clicks.push(p);e.preventDefault()},{passive:false});
addEventListener('pointercancel',e=>{if(e.pointerId===tp.id)tp.id=null;if(e.pointerId===volDrag)volDrag=null});
addEventListener('contextmenu',e=>e.preventDefault());
// on phones that allow it, the first tap goes fullscreen and locks landscape
let fsTried=false;
addEventListener('pointerup',e=>{if(fsTried||!TOUCH||e.pointerType==='mouse')return;fsTried=true;
  const el=document.documentElement,rf=el.requestFullscreen||el.webkitRequestFullscreen;
  try{const pr=rf&&rf.call(el);if(pr&&pr.then)pr.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(_){}setTimeout(fit,200)}).catch(()=>{})}catch(_){}},true);
addEventListener('keydown',e=>{if(!keys[e.key])keyQ.push(e.key);keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});
addEventListener('keyup',e=>{keys[e.key]=false});

// ---- drawing helpers
function D(id,x=0,y=0,a=1){const im=IMG[id];if(!im||a<=0)return;if(a<1)ctx.globalAlpha=a;ctx.drawImage(im,x,y);if(a<1)ctx.globalAlpha=1}
function black(a=1){ctx.globalAlpha=a;ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);ctx.globalAlpha=1}
const F_CLK={0:238,1:339,2:341,3:342,4:343,5:344,6:345,7:346,8:347,9:349};   // 20x39
const F_N14={0:372,1:373,2:374,3:375,4:376,5:377,6:378,7:379,8:380,9:381};   // 8x14
const F_P17={0:187,1:191,2:192,3:193,4:194,5:195,6:196,7:197,8:198,9:199};   // 14x17
const F_AI={0:532,1:590,2:592,3:594,4:595,5:596,6:597,7:598,8:599,9:600};     // 22x42
function numW(s,f,gap){let w=0;for(const ch of String(s))w+=IMG[f[ch]].width+gap;return w-gap}
function num(s,f,x,y,gap=2){for(const ch of String(s)){const im=IMG[f[ch]];ctx.drawImage(im,x,y);x+=im.width+gap}return x}

// ---- save (per-browser convenience; game works without it)
let SAVE={level:1,beatgame:0,beat6:0,beat7:0};
try{Object.assign(SAVE,JSON.parse(localStorage.getItem('fnaf1')||'{}'))}catch(e){}
function writeSave(){try{localStorage.setItem('fnaf1',JSON.stringify(SAVE))}catch(e){}}

// ============================================================ audio (Clickteam-style channels, volume 0..100)
const LONG=new Set(['voiceover1c','voiceover2a','voiceover3','voiceover4','voiceover5','ColdPresc B','EerieAmbienceLargeSca_MV005','ambience2','darkness music','music box','static2']);
const CH={};let loose=[];
function mk(name,vol,loop){
  if(!AC)return null;
  const g=AC.createGain();g.gain.value=vol/100;g.connect(master);
  if(BUF[name]){
    const s=AC.createBufferSource();s.buffer=BUF[name];s.loop=loop;
    if(loop&&URLS[name].mp3){s.loopStart=.03;s.loopEnd=s.buffer.duration-.03}   // trim mp3 encoder padding
    s.connect(g);s.start();
    const h={stop(){try{s.stop()}catch(e){}},vol(v){g.gain.value=v/100},done:false};s.onended=()=>h.done=true;return h;
  }
  if(!URLS[name])return null;
  const a=new Audio(URLS[name].url);a.loop=loop;
  try{AC.createMediaElementSource(a).connect(g)}catch(e){a.volume=Math.min(1,vol/100*volGain())}
  a.play().catch(()=>{});
  const h={stop(){a.pause()},vol(v){g.gain.value=v/100;},done:false};a.onended=()=>h.done=true;return h;
}
function snd(name,ch,vol=100,loop=false){stopCh(ch);const h=mk(name,vol,loop);if(ch!=null)CH[ch]=h;else if(h)loose.push(h);return h}
function stopCh(ch){if(ch!=null&&CH[ch]){CH[ch].stop();delete CH[ch]}}
function volCh(ch,v){if(CH[ch])CH[ch].vol(v)}
function playing(ch){return CH[ch]&&!CH[ch].done}
function stopAll(){for(const k in CH)stopCh(k);loose.forEach(h=>h.stop());loose=[]}

// ============================================================ loader
let loadP=0,loaded=false,loadErr='';
async function load(){
  const man=await (await fetch('packs/manifest.json')).json();
  const total=man.packs.reduce((a,p)=>a+p[1],0);let got=0;
  const blobs=await Promise.all(man.packs.map(async([fn])=>{
    const r=await fetch('packs/'+fn);if(!r.ok)throw new Error(fn+' '+r.status);
    if(!r.body||!r.body.getReader){const b=await r.blob();got+=b.size;loadP=got/total;return b}
    const rd=r.body.getReader(),parts=[];
    for(;;){const{done,value}=await rd.read();if(done)break;parts.push(value);got+=value.length;loadP=got/total}
    return new Blob(parts);
  }));
  const waits=[];
  for(const[k,[p,o,l,m]]of Object.entries(man.img)){
    const im=new Image();im.src=URL.createObjectURL(blobs[p].slice(o,o+l,m));IMG[k]=im;
    waits.push(im.decode?im.decode().catch(()=>{}):new Promise(r=>im.onload=im.onerror=r));
  }
  for(const[k,[p,o,l,m]]of Object.entries(man.aud))URLS[k]={blob:blobs[p].slice(o,o+l,m),url:URL.createObjectURL(blobs[p].slice(o,o+l,m)),mp3:m==='audio/mpeg'};
  await Promise.all(waits);loaded=true;
}
async function unlockAudio(){
  const C=window.AudioContext||window.webkitAudioContext;AC=new C();master=AC.createGain();master.gain.value=volGain();master.connect(AC.destination);
  if(AC.state==='suspended')AC.resume();
  await Promise.all(Object.keys(URLS).filter(k=>!LONG.has(k)).map(async k=>{
    try{const ab=await URLS[k].blob.arrayBuffer();BUF[k]=await new Promise((res,rej)=>AC.decodeAudioData(ab,res,rej))}catch(e){}
  }));
}
// browsers only allow sound after the player's first click or key press, so start audio then
let audioReq=false;
function wantAudio(){if(audioReq)return;audioReq=true;unlockAudio().then(()=>{if(scene&&scene.onAudio)scene.onAudio()})}
addEventListener('pointerdown',wantAudio,true);addEventListener('keydown',wantAudio,true);
// iPhones only let sound start on a finger lift, so nudge the audio awake then too
const wake=()=>{if(AC&&AC.state!=='running')AC.resume()};
addEventListener('pointerup',wake,true);addEventListener('touchend',wake,true);

// ============================================================ scenes
let scene=null;
function go(s,...a){scene=s;s.init&&s.init(...a)}

const S_LOAD={
  init(){this.t=0;this.ready=false},
  update(){this.t++;if(loaded)go(S_TITLE)},
  draw(){black();ctx.fillStyle='#ccc';ctx.font='24px "Courier New",monospace';ctx.textAlign='center';
    if(loadErr){ctx.fillText('Could not load the game files: '+loadErr,640,360);ctx.textAlign='left';return}
    ctx.fillText('LOADING  '+Math.floor(loadP*100)+'%',640,350);ctx.strokeStyle='#888';ctx.strokeRect(440,375,400,14);ctx.fillStyle='#ccc';ctx.fillRect(442,377,396*loadP,10);
    ctx.textAlign='left'}
};

// ---------------------------------------------------------------- title
const MENU=[{id:448,y:404,key:'new'},{id:449,y:474,key:'cont'},{id:443,y:544,key:'six'},{id:526,y:614,key:'custom'}];
const S_TITLE={
  init(){stopAll();this.t=0;this.face=431;this.hold=0;this.gap=0;this.sa=.5;this.band=false;this.sel=0;this.go=0;this.del=0;
    this.creepy=R(1000)===0;if(!this.creepy){snd('static2',1,100,true);snd('darkness music',2,100,true)}},
  onAudio(){if(!this.creepy){snd('static2',1,100,true);snd('darkness music',2,100,true)}},
  items(){return MENU.filter(m=>m.key==='new'||m.key==='cont'||(m.key==='six'&&SAVE.beatgame)||(m.key==='custom'&&SAVE.beat6))},
  update(){
    this.t++;
    if(this.creepy){if(this.t>=600){this.creepy=false;this.t=0;snd('static2',1,100,true);snd('darkness music',2,100,true)}clicks=[];keyQ=[];return}
    // a flicker face stays up ~0.18 s, then the lineup holds for a beat before the next one can come
    // per check: The Zuck 5.2%, Dario / Elon / Altman 1.7% each
    if(this.hold>0){if(--this.hold===0){this.face=431;this.gap=10}}
    else if(this.gap>0)this.gap--;
    else if(this.t%5===0){const r=R(1000);this.face=r<52?441:r<69?440:r<86?442:r<103?900:431;if(this.face!==431)this.hold=11}
    if(this.t%5===0)this.sa=.6*(1-(50+R(100))/255);
    if(this.t%18===0)this.band=R(3)===0;
    if(this.go){if(--this.go===0)this.launch();return}
    const items=this.items();
    items.forEach((m,i)=>{if(mx>=150&&mx<=520&&my>=m.y-8&&my<=m.y+44&&this.sel!==i){this.sel=i;snd('blip3',3)}});
    for(const k of keyQ){
      if(k==='ArrowDown'){this.sel=(this.sel+1)%items.length;snd('blip3',3)}
      if(k==='ArrowUp'){this.sel=(this.sel+items.length-1)%items.length;snd('blip3',3)}
      if(k==='Enter')this.go=20;
    }
    for(const[x,y]of clicks)items.forEach((m,i)=>{if(x>=150&&x<=520&&y>=m.y-8&&y<=m.y+44){this.sel=i;this.go=20}});
    this.del=keys['Delete']?this.del+1:0;
    if(this.del===60){SAVE={level:1,beatgame:0,beat6:0,beat7:0};writeSave();this.sel=0}
  },
  launch(){const k=this.items()[this.sel].key;
    if(k==='new'){SAVE.level=1;writeSave();go(S_AD)}
    else if(k==='cont'){const n=Math.min(5,SAVE.level||1);n===1?go(S_AD):go(S_CARD,n)}   // night 1: show the job ad first
    else if(k==='six')go(S_CARD,6);
    else go(S_CUSTOM)},
  draw(){
    black();
    if(this.creepy){D(this.t>=570?520:545);return}
    D(this.face);
    D([12,13,14,15,16,17,18,20][R(8)],0,0,this.sa);
    D(444,175,79);
    const st=[SAVE.beatgame,SAVE.beat6,SAVE.beat7].filter(Boolean).length;
    for(let i=0;i<st;i++)D(432,175+i*75,300);
    const items=this.items();
    items.forEach((m,i)=>{D(m.id,175,m.y);if(i===this.sel)D(450,95,m.y+4)});
    if(items[1]){const y=items[1].y+40;D(447,177,y);num(Math.min(5,SAVE.level||1),F_P17,177+70,y-3)}
    {const cw=IMG[433].width,cx=1266-cw;   // credit line, right-aligned; it links to amsultan.site
      D(433,cx,690);ctx.fillStyle='#fff';ctx.globalAlpha=CREDIT.hover?1:.35;ctx.fillRect(cx,706,cw,2);ctx.globalAlpha=1}
    D(591,8,698);
  }
};

// ---------------------------------------------------------------- newspaper ad
const S_AD={
  init(){stopAll();this.t=0},
  update(){this.t++;if((clicks.length||keyQ.includes('Enter')||keyQ.includes('Escape'))&&this.t>10)this.t=Math.max(this.t,420);if(this.t>=540)go(S_CARD,1)},
  draw(){black();const t=this.t,a=t<120?t/120:t<420?1:1-(t-420)/120;D(574,0,0,a)}
};

// ---------------------------------------------------------------- night card
const CARD=[0,453,454,472,473,474,446,538];
const S_CARD={
  init(n){stopAll();this.n=n;this.t=0;snd('blip3',1)},
  update(){this.t++;if(this.t>=130+61+6)go(S_NIGHT,this.n)},
  draw(){black();const t=this.t;
    if(t<130+61){const a=t<130?1:1-(t-130)/61;D(CARD[this.n],525,312,a);if(t<12)D([4,6,8,9,10,21,22,25,23][Math.min(8,Math.floor(t*.7))],0,0,.5)}
    else D(482,1220,660);}
};

// ---------------------------------------------------------------- 6 AM
const S_SIX={
  init(n){stopAll();this.n=n;this.t=0;snd('chimes 2',1)},
  update(){this.t++;const t=this.t;
    if(t===540)snd('CROWD_SMALL_CHIL_EC049202',2);
    if(t===720)this.finish()},
  finish(){const n=this.n;
    if(n<5)SAVE.level=n+1;
    if(n===5){SAVE.beatgame=1;SAVE.level=5}
    if(n===6)SAVE.beat6=1;
    if(n===7&&CUST.every(v=>v===20))SAVE.beat7=1;
    writeSave();
    if(n<5)go(S_CARD,n+1);else go(S_END,n===5?210:n===6?522:523)},
  draw(){black();const t=this.t,a=t<60?t/60:t>660?1-(t-660)/60:1;
    const p=t<240?0:t>540?1:(t-240)/300;const y=324;
    ctx.save();ctx.globalAlpha=a;ctx.beginPath();ctx.rect(540,y,80,72);ctx.clip();
    ctx.drawImage(IMG[350],560,y-p*76);ctx.drawImage(IMG[351],560,y+76-p*76);ctx.restore();
    D(352,632,y,a)}
};

// ---------------------------------------------------------------- endings (paycheck / pink slip)
const S_END={
  init(img){stopAll();this.img=img;this.t=0;snd('music box',1,100,true)},
  update(){this.t++;if(this.t>=120+900+120)go(S_TITLE)},
  draw(){black();const t=this.t,a=t<120?t/120:t>1020?1-(t-1020)/120:1;D(this.img,0,0,a)}
};

// ---------------------------------------------------------------- death
const S_DIED={
  init(){stopAll();this.t=0;snd('static',1)},
  update(){this.t++;if(this.t>=600)go(S_OVER)},
  draw(){D([12,13,14,15,16,17,18,20][R(8)]);if(R(6)===0)D([4,6,8,9,10,21,22,25][R(8)],0,0,.25)}
};
const S_OVER={
  init(){stopAll();this.t=0},
  update(){this.t++;if(this.t%60===0&&R(10000)===0)return go(S_CREEPY);if(this.t>=600)go(S_TITLE)},
  draw(){black();const a=Math.min(1,this.t/61);D(358,0,0,a);D(471,1043,663,a)}
};
const S_CREEPY={   // Jensen (Golden Freddy): the original quits the app after 1 s; here it cuts to black, then title
  init(){stopAll();this.t=0;snd('XSCREAM2',29)},
  update(){this.t++;if(this.t>=60&&this.t===60)stopAll();if(this.t>=240)go(S_TITLE)},
  draw(){black();if(this.t<60)D(548)}
};
// Altman's power-out kill: dark face lunge, then static
const FREDDY_DARK=[326,307,348,308,309,310,311,312,313,314,315,316,317,318,319,320,321,322,323,324,325];
const S_FREDKILL={
  init(){stopAll();this.t=0;snd('XSCREAM',1)},
  update(){this.t++;if(this.t===85)snd('static',1);if(this.t>=720)go(S_OVER)},
  draw(){const t=this.t;
    if(t<85){let f=Math.floor(t*.5);if(f>=21)f=5+(f-21)%16;D(FREDDY_DARK[f])}
